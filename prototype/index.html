<title>Brawl Picks Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow column, like a phone. Home = search + live rotation + map list.
   Map = mode-coloured header, top-5 podium, ranked list. Account = step-2 preview. */
:root {
  --bg: #13101d;
  --panel: #1d182c;
  --panel2: #282140;
  --line: #372e55;
  --text: #f5f2ff;
  --dim: #a69cc8;
  --accent: #ffc928;
  --accent-ink: #1d1400;
  --good: #3ddc84;
  --bad: #ff6b6b;
  --f-display: "Lilita One", "Arial Black", Impact, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--text); }
body {
  font: 15px/1.45 var(--f-body);
  margin: 0;
}
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 24px;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* proto banner */
.proto {
  display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap;
  margin-top: 10px; padding: 8px 12px; border-radius: 10px;
  background: repeating-linear-gradient(-45deg, #2a2210, #2a2210 10px, #241d0d 10px, #241d0d 20px);
  color: #ffe08a; font-size: 12.5px; border: 1px dashed #6b5517;
}
.proto b { font-weight: 800; letter-spacing: .06em; text-transform: uppercase; font-size: 11px; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0 10px; }
.logo { font-family: var(--f-display); font-size: 26px; letter-spacing: .5px; color: var(--text); text-decoration: none; background: none; border: 0; padding: 0; }
.logo span { color: var(--accent); }
.acct {
  display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px;
  background: var(--panel); border: 2px solid var(--line); border-radius: 999px; font-weight: 700; font-size: 13px;
}
.acct:hover { border-color: var(--accent); }
.acct i { width: 26px; height: 26px; border-radius: 50%; background: var(--panel2); display: grid; place-items: center; font-style: normal; font-size: 13px; }
.acct.on i { background: var(--accent); color: var(--accent-ink); font-family: var(--f-display); }

/* search */
.searchbox { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; padding: 6px 0 10px; background: var(--bg); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.sb { position: relative; }
#q {
  width: 100%; font-size: 19px; font-weight: 600;
  padding: 15px 52px 15px 18px; border-radius: var(--r);
  border: 2px solid var(--line); background: var(--panel); outline: none;
}
#q:focus { border-color: var(--accent); }
#q::placeholder { color: var(--dim); font-weight: 500; }
.sb kbd {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  font: 12px var(--f-num); color: var(--dim); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px;
}
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.chip {
  border: 2px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 11px;
  font-size: 12.5px; font-weight: 700; color: var(--dim); display: inline-flex; align-items: center; gap: 6px;
}
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.chip .d { width: 8px; height: 8px; border-radius: 50%; background: var(--mc); }

h2 {
  font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .12em; font-weight: 800;
  margin: 18px 0 10px; display: flex; justify-content: space-between; align-items: baseline;
}
h2 small { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 12px; }

/* live rotation */
.rot { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.lcard {
  text-align: left; border: 0; border-radius: 12px; padding: 0; overflow: hidden;
  background: var(--panel); display: grid; grid-template-columns: 54px 1fr; min-width: 0;
  border: 2px solid transparent;
}
.lcard:hover { border-color: var(--mc); }
.lcard canvas { width: 54px; height: 70px; display: block; }
.lcard .lt { padding: 8px 10px; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 1px; }
.lcard .lm { font-size: 11px; font-weight: 800; color: var(--mc); text-transform: uppercase; letter-spacing: .05em; }
.lcard .ln { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lcard .lx { font: 11px var(--f-num); color: var(--dim); }

/* results */
.results { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.results li {
  display: flex; align-items: center; gap: 12px; padding: 11px 14px;
  border-radius: 12px; background: var(--panel); cursor: pointer; border: 2px solid transparent;
}
.results li.sel, .results li:hover { border-color: var(--accent); background: var(--panel2); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--mc); flex: none; }
.name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.name u { text-decoration: none; color: var(--accent); font-weight: 800; }
.meta { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--dim); flex: none; }
.minis { display: flex; }
.minis .av { width: 22px; height: 22px; font-size: 9px; margin-left: -5px; border: 2px solid var(--panel); }
.results li:hover .minis .av, .results li.sel .minis .av { border-color: var(--panel2); }
.tag { font-size: 10.5px; font-weight: 800; color: var(--accent-ink); background: var(--accent); border-radius: 5px; padding: 1px 6px; text-transform: uppercase; letter-spacing: .03em; }
.tag.live { background: var(--good); color: #002a12; }
.hint { color: var(--dim); font-size: 13px; text-align: center; margin: 14px 0; }
.enter { font: 11px var(--f-num); color: var(--dim); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
.results li:not(.sel) .enter { visibility: hidden; }

/* avatars */
.av {
  border-radius: 50%; display: grid; place-items: center; flex: none;
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--cc) 70%, white), var(--cc) 60%, color-mix(in srgb, var(--cc) 60%, black));
  color: #fff; font-family: var(--f-display); text-shadow: 0 1px 0 rgba(0,0,0,.45); letter-spacing: .5px;
}

/* map view */
.back { background: none; border: 0; color: var(--dim); font-weight: 700; padding: 6px 0; font-size: 14px; }
.back:hover { color: var(--text); }
.maphead { display: flex; gap: 16px; align-items: center; padding: 8px 0 16px; border-bottom: 3px solid var(--mc); }
.maphead canvas { width: 88px; height: 114px; border-radius: 10px; flex: none; }
.maphead h1 { margin: 2px 0 4px; font-family: var(--f-display); font-weight: 400; font-size: 34px; line-height: 1.05; letter-spacing: .3px; text-wrap: balance; }
.mode { margin: 0; color: var(--mc); font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sub { margin: 6px 0 0; color: var(--dim); font-size: 12.5px; }
.sub b { font-family: var(--f-num); font-weight: 500; color: var(--text); }

.seg { display: inline-flex; background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 3px; margin: 16px 0 4px; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 13px; color: var(--dim); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.segnote { font-size: 12.5px; color: var(--dim); margin: 6px 0 0; min-height: 1.4em; }
.segnote a { color: var(--accent); cursor: pointer; text-decoration: underline; }

.top5 { list-style: none; margin: 16px 0 6px; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.top5 li {
  background: var(--panel); border-radius: var(--r); padding: 14px 6px 12px; position: relative;
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; border: 2px solid var(--line); min-width: 0;
}
.top5 li:first-child { border-color: var(--accent); background: linear-gradient(180deg, #3b2f10, var(--panel) 65%); }
.top5 .av { width: 62px; height: 62px; font-size: 22px; margin-bottom: 4px; }
.rank {
  position: absolute; top: -9px; left: -7px; width: 26px; height: 26px; border-radius: 50%;
  display: grid; place-items: center; font-family: var(--f-display); font-size: 15px; color: var(--accent-ink); background: var(--accent);
}
.bn { font-weight: 800; font-size: 14px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cls { font-size: 10.5px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
.wrbig { font: 700 18px var(--f-num); margin-top: 4px; }
.wrbig.hi { color: var(--good); }
.ur { font: 11px var(--f-num); color: var(--dim); }
.build { margin-top: 6px; font: 700 10px var(--f-num); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; padding: 2px 6px; border-radius: 5px; background: var(--panel2); color: var(--dim); }
.build.max { background: color-mix(in srgb, var(--good) 22%, transparent); color: var(--good); }
.build.low { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }

.legend { font-size: 12px; color: var(--dim); margin: 10px 0 0; }
.legend b { color: var(--text); }

.rest { list-style: none; margin: 0; padding: 0; }
.rest li {
  display: grid; grid-template-columns: 22px 34px minmax(0, 1fr) minmax(60px, 1.1fr) 58px; align-items: center; gap: 10px;
  padding: 7px 4px; border-bottom: 1px solid var(--panel2);
}
.rest li.locked { opacity: .38; }
.rest .av { width: 34px; height: 34px; font-size: 13px; }
.rk { color: var(--dim); font: 700 13px var(--f-num); text-align: right; }
.rn { min-width: 0; display: flex; flex-direction: column; }
.rn b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rn span { font-size: 11.5px; color: var(--dim); }
.barwrap { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
.bar { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.wr { text-align: right; font: 600 13px var(--f-num); }

/* account */
.acctview h1 { font-family: var(--f-display); font-weight: 400; font-size: 32px; margin: 6px 0 4px; }
.acctview p { color: var(--dim); max-width: 60ch; margin: 0 0 12px; }
.tagform { display: flex; gap: 8px; flex-wrap: wrap; }
.tagform input { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); font: 600 16px var(--f-num); text-transform: uppercase; outline: none; }
.tagform input:focus { border-color: var(--accent); }
.btn { border: 0; border-radius: 12px; padding: 12px 18px; background: var(--accent); color: var(--accent-ink); font-weight: 800; }
.btn.ghost { background: var(--panel2); color: var(--text); }
.pcard { display: flex; gap: 14px; align-items: center; background: var(--panel); border-radius: var(--r); padding: 14px; margin-top: 14px; flex-wrap: wrap; }
.pcard .av { width: 56px; height: 56px; font-size: 20px; }
.pcard .pi { flex: 1; min-width: 160px; }
.pcard .pi b { font-size: 18px; display: block; }
.pcard .pi span { font: 12px var(--f-num); color: var(--dim); }
.stats3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
.stats3 div { background: var(--panel); border-radius: 12px; padding: 10px 12px; }
.stats3 b { display: block; font: 700 20px var(--f-num); }
.stats3 span { font-size: 12px; color: var(--dim); }
.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.roster div { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; text-align: center; min-width: 0; }
.roster .av { width: 44px; height: 44px; font-size: 15px; }
.roster div.no { opacity: .3; }
.roster em { font-style: normal; font: 700 10.5px var(--f-num); color: var(--dim); }
.roster em.max { color: var(--good); }

.foot { color: var(--dim); font-size: 12px; text-align: center; padding: 28px 0 8px; }

@media (max-width: 600px) {
  .top5 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .top5 li { grid-column: span 2; }
  .top5 li:nth-child(4) { grid-column: 2 / span 2; }
  .top5 li:nth-child(n+4) { margin-top: 10px; }
  .rot { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .maphead h1 { font-size: 27px; }
  .maphead canvas { width: 70px; height: 91px; }
  .meta .mname, .minis { display: none; }
  .rest li { grid-template-columns: 20px 32px minmax(0, 1fr) 54px 52px; gap: 8px; }
}
@media (prefers-reduced-motion: no-preference) {
  .top5 li { animation: pop .28s ease-out both; }
  .top5 li:nth-child(2) { animation-delay: .03s } .top5 li:nth-child(3) { animation-delay: .06s }
  .top5 li:nth-child(4) { animation-delay: .09s } .top5 li:nth-child(5) { animation-delay: .12s }
  @keyframes pop { from { transform: translateY(6px) scale(.97); } to { transform: none; } }
}
</style>

<div class="wrap">
  <div class="proto"><span><b>Prototype</b> &nbsp;All numbers are made-up sample data. Use it to judge the layout and flow.</span><span>Try: type <span class="enter" style="visibility:visible">hrm</span> then Enter</span></div>

  <header class="top">
    <button class="logo" id="home" aria-label="Home">Brawl<span>Picks</span></button>
    <button class="acct" id="acctBtn"><i>?</i><span>Add player tag</span></button>
  </header>

  <main id="app"></main>

  <footer class="foot">Sample data for layout review · stats would come from top-player battle logs, refreshed daily · not affiliated with Supercell</footer>
</div>

<script>
// ---------- seeded random ----------
function rng(seed) {
  let a = typeof seed === 'number' ? seed : [...seed].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 2654435761) >>> 0, 1779033703);
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

// ---------- sample data ----------
const CLASSES = {
  Tank:       { c: '#e0533d', list: 'Bull,El Primo,Rosa,Frank,Jacky,Darryl,Bibi,Ash,Hank,Buster,Draco,Meg,Ollie' },
  Assassin:   { c: '#9b4fe0', list: 'Mortis,Crow,Leon,Edgar,Stu,Buzz,Fang,Sam,Cordelius,Mico,Lily,Melodie,Kenji,Shade' },
  Sniper:     { c: '#3b8fe8', list: 'Piper,Brock,Bea,Nani,Belle,Mandy,Bonnie,Janet,Maisie,Angelo' },
  Thrower:    { c: '#2fb36b', list: 'Barley,Dynamike,Tick,Sprout,Grom,Willow,Larry & Lawrie,Juju' },
  Support:    { c: '#21b8b0', list: 'Poco,Pam,Max,Gus,Byron,Kit,Doug,Berry,Ruffs,Gray' },
  Controller: { c: '#e8901f', list: 'Gene,Tara,Lou,Sandy,Emz,Squeak,Otis,Mr. P,Charlie,Chuck,Gale,Amber,Penny,Jessie,Bo' },
  Damage:     { c: '#d9407f', list: 'Shelly,Colt,Rico,Spike,8-Bit,Carl,Nita,Colette,Lola,Eve,Clancy,Pearl,Chester,Griff,Surge,R-T,Moe' },
};
const BRAWLERS = [];
for (const [cls, { c, list }] of Object.entries(CLASSES)) for (const n of list.split(',')) BRAWLERS.push({ id: BRAWLERS.length, n, cls, c });
// overall "meta strength" per brawler
{ const r = rng('meta-v1'); for (const b of BRAWLERS) b.base = (r() - 0.5) * 6; }

const MODES = {
  'Gem Grab':  { c: '#b74cf0', fit: { Controller: 2.2, Support: 1.8, Damage: 1, Thrower: .5, Tank: -.8, Assassin: -.6, Sniper: -.4 } },
  'Brawl Ball':{ c: '#7ab3f5', fit: { Tank: 2.6, Assassin: 1.8, Damage: 1, Support: .3, Controller: .2, Sniper: -1.8, Thrower: -1.2 } },
  'Heist':     { c: '#d65cd3', fit: { Damage: 2.6, Assassin: 1.4, Tank: .6, Thrower: .3, Support: -.8, Controller: -.4, Sniper: -.4 } },
  'Bounty':    { c: '#2bd1d9', fit: { Sniper: 2.8, Thrower: 1.2, Controller: .8, Support: .4, Damage: .2, Tank: -2, Assassin: -1.2 } },
  'Knockout':  { c: '#f7831c', fit: { Sniper: 2.6, Thrower: 1.6, Support: 1, Controller: .6, Damage: 0, Tank: -1.8, Assassin: -1 } },
  'Hot Zone':  { c: '#e33b50', fit: { Controller: 2.4, Thrower: 1.6, Tank: 1.2, Support: .8, Damage: .2, Sniper: -1.2, Assassin: -1 } },
};
const MAPLIST = {
  'Gem Grab': 'Hard Rock Mine,Gem Fort,Undermine,Double Swoosh,Crystal Arcade,Last Stop,Rustic Arcade',
  'Brawl Ball': 'Backyard Bowl,Pinball Dreams,Triple Dribble,Sneaky Fields,Center Stage,Super Beach,Beach Ball',
  'Heist': 'Hot Potato,Safe Zone,Bridge Too Far,Kaboom Canyon,Pit Stop',
  'Bounty': 'Shooting Star,Layer Cake,Hideout,Dry Season,Canal Grande',
  'Knockout': "Belle's Rock,Out in the Open,Goldarm Gulch,New Horizons,Flaring Phoenix,Deep End",
  'Hot Zone': 'Dueling Beetles,Ring of Fire,Open Business,Parallel Plays,Split',
};
const RANKED = new Set(['Hard Rock Mine','Gem Fort','Double Swoosh','Backyard Bowl','Pinball Dreams','Triple Dribble','Hot Potato','Safe Zone','Shooting Star','Layer Cake','Hideout',"Belle's Rock",'Out in the Open','Goldarm Gulch','Dueling Beetles','Ring of Fire','Open Business']);
const LIVE = { 'Hard Rock Mine': 3.4, 'Sneaky Fields': 9.1, 'Safe Zone': 1.2, 'Shooting Star': 15.8, 'Goldarm Gulch': 6.5, 'Ring of Fire': 22.0 };

const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const MAPS = [];
for (const [mode, names] of Object.entries(MAPLIST)) for (const name of names.split(',')) {
  const r = rng('map:' + name);
  const battles = Math.round(900 + r() * 5200);
  const picks = BRAWLERS.map((b) => {
    const wrTrue = 50 + (MODES[mode].fit[b.cls] || 0) * 1.6 + b.base + (r() - 0.5) * 7;
    const pop = Math.max(0.05, wrTrue - 44 + r() * 6);           // good brawlers get picked more
    return { b, wrTrue, pop };
  });
  const popSum = picks.reduce((s, p) => s + p.pop, 0);
  for (const p of picks) {
    p.games = Math.max(3, Math.round((p.pop / popSum) * battles * 6)); // 6 picks per battle
    p.wins = Math.round(p.games * Math.min(0.8, Math.max(0.25, (p.wrTrue + (r() - 0.5) * 4) / 100)));
    p.wr = (100 * p.wins) / p.games;
    p.use = (100 * p.games) / battles;
    p.score = (100 * (p.wins + 10)) / (p.games + 20);   // README: shrink toward 50% with 20-game prior
  }
  picks.sort((a, b) => b.score - a.score);
  MAPS.push({ id: slug(name), name, mode, mc: MODES[mode].c, ranked: RANKED.has(name), live: LIVE[name] ?? null, battles, picks: picks.slice(0, 20) });
}
const mapsById = new Map(MAPS.map((m) => [m.id, m]));

// sample account for the step-2 preview
function makeAccount(tag) {
  const r = rng('acct:' + tag);
  const own = {};
  for (const b of BRAWLERS) {
    if (r() < 0.24) continue;                       // not unlocked
    const p = r() < 0.45 ? 11 : Math.max(1, Math.round(6 + r() * 4.6));
    own[b.id] = { p, sp: p >= 9 ? (r() < .55 ? 1 : 0) + (r() < .25 ? 1 : 0) : 0, g: p >= 7 ? (r() < .7 ? 1 : 0) + (r() < .3 ? 1 : 0) : 0, gears: p >= 8 ? Math.round(r() * 2) : 0 };
  }
  const trophies = Object.values(own).reduce((s, o) => s + 380 + o.p * 55, 0);
  return { tag, name: 'SampleBrawler', trophies, own };
}
// how "ready" an owned brawler is: power level dominates, then star power, gadget, gears
function readiness(o) {
  if (!o) return 0;
  return Math.min(1, (o.p / 11) * 0.7 + Math.min(o.sp, 1) * 0.12 + Math.min(o.g, 1) * 0.1 + Math.min(o.gears, 2) * 0.04);
}
const buildLabel = (o) => !o ? 'Locked' : `P${o.p}${o.sp ? ' · ' + o.sp + 'SP' : ''}${o.g ? ' · ' + o.g + 'G' : ''}`;
const buildClass = (o) => { const x = readiness(o); return x >= 0.95 ? 'max' : x < 0.62 ? 'low' : ''; };

// ---------- search (same rules as site/search.js) ----------
const normalize = (s) => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/['’`.]/g, '').trim();
const words = (n) => normalize(n).split(/[^a-z0-9]+/).filter(Boolean);
const initials = (n) => words(n).map((w) => w[0]).join('');
function matchScore(query, name) {
  const q = normalize(query).replace(/\s+/g, ' '); if (!q) return null;
  const ini = initials(name), full = normalize(name), cq = q.replace(/[^a-z0-9]/g, '');
  if (cq && ini === cq) return 0;
  if (cq && ini.startsWith(cq)) return 1;
  if (full.startsWith(q)) return 2;
  const qw = q.split(' ').filter(Boolean); let i = 0;
  for (const w of words(name)) if (i < qw.length && w.startsWith(qw[i])) i++;
  if (i === qw.length) return 3;
  if (full.includes(q)) return 4;
  let j = 0; for (const c of ini) if (c === cq[j]) j++;
  if (cq.length >= 2 && j === cq.length) return 5;
  return null;
}

// ---------- state ----------
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const S = {
  q: '', sel: 0, shown: [],
  mode: null, rankedOnly: store.get('bp-ranked') === '1',
  view: 'meta',
  account: store.get('bp-tag') ? makeAccount(store.get('bp-tag')) : null,
};

const $ = (s, el = document) => el.querySelector(s);
const app = $('#app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const ab = (n) => { const w = n.replace(/[^A-Za-z0-9& ]/g, ' ').split(/\s+/).filter(Boolean); return (w.length > 1 ? w[0][0] + w[1][0] : n.replace(/[^A-Za-z0-9]/g, '').slice(0, 2)).toUpperCase(); };
const av = (b, extra = '') => `<span class="av" style="--cc:${b.c}" ${extra}>${esc(ab(b.n))}</span>`;
const pct = (x) => x.toFixed(1) + '%';
const hrs = (h) => h < 1 ? Math.round(h * 60) + 'm' : Math.floor(h) + 'h ' + String(Math.round((h % 1) * 60)).padStart(2, '0') + 'm';

// tiny procedural "map art" so each map has a recognisable thumbnail
function drawMap(cv, m) {
  const W = 21, H = 27, dpr = 2;
  cv.width = W * 4 * dpr; cv.height = H * 4 * dpr;
  const x = cv.getContext('2d'); x.scale(4 * dpr, 4 * dpr);
  x.fillStyle = '#d9b77a'; x.fillRect(0, 0, W, H);
  const r = rng('art:' + m.name);
  const put = (cx, cy, col) => { x.fillStyle = col; x.fillRect(cx, cy, 1, 1); x.fillRect(W - 1 - cx, H - 1 - cy, 1, 1); };
  for (let i = 0; i < 26; i++) { // mirrored blobs: walls, bushes, water
    const col = [ '#8a5a3c', '#3f9c4a', '#3f9c4a', '#4a8fd6' ][Math.floor(r() * 4)];
    let cx = Math.floor(r() * W), cy = Math.floor(r() * (H / 2));
    for (let k = 0; k < 2 + r() * 6; k++) { put(cx, cy, col); r() < .5 ? cx += r() < .5 ? 1 : -1 : cy += r() < .5 ? 1 : -1; cx = Math.max(0, Math.min(W - 1, cx)); cy = Math.max(0, Math.min(H - 1, cy)); }
  }
  x.fillStyle = m.mc; x.globalAlpha = .9;
  x.fillRect(Math.floor(W / 2) - 1, Math.floor(H / 2) - 1, 3, 3); x.globalAlpha = 1;
  x.fillStyle = '#3b7ff0'; x.fillRect(8, H - 2, 5, 2);
  x.fillStyle = '#ef4a4a'; x.fillRect(8, 0, 5, 2);
}

// ---------- views ----------
function pool() { return MAPS.filter((m) => (!S.rankedOnly || m.ranked) && (!S.mode || m.mode === S.mode)); }

function renderHome() {
  const liveMaps = MAPS.filter((m) => m.live != null).sort((a, b) => a.live - b.live);
  app.innerHTML = `
    <section class="searchbox">
      <div class="sb">
        <input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Map initials, e.g. hrm → Hard Rock Mine" aria-label="Search maps" value="${esc(S.q)}">
        <kbd>/</kbd>
      </div>
      <div class="chips" id="chips">
        <button class="chip" data-f="ranked" aria-pressed="${S.rankedOnly}">Ranked only</button>
        ${Object.entries(MODES).map(([k, v]) => `<button class="chip" data-mode="${esc(k)}" aria-pressed="${S.mode === k}" style="--mc:${v.c}"><span class="d"></span>${esc(k)}</button>`).join('')}
      </div>
    </section>
    <div id="liveWrap" ${S.q ? 'hidden' : ''}>
      <h2>Live now <small>rotation · time left</small></h2>
      <div class="rot">${liveMaps.map((m) => `
        <button class="lcard" data-id="${m.id}" style="--mc:${m.mc}">
          <canvas data-art="${m.id}"></canvas>
          <span class="lt"><span class="lm">${esc(m.mode)}</span><span class="ln">${esc(m.name)}</span><span class="lx">${hrs(m.live)} left</span></span>
        </button>`).join('')}</div>
    </div>
    <h2 id="listHead"></h2>
    <ul id="results" class="results" role="listbox" aria-label="Maps"></ul>
    <p id="hint" class="hint"></p>`;
  document.querySelectorAll('canvas[data-art]').forEach((cv) => drawMap(cv, mapsById.get(cv.dataset.art)));
  renderResults();
  const q = $('#q');
  q.addEventListener('input', () => { S.q = q.value; S.sel = 0; $('#liveWrap').hidden = !!S.q.trim(); renderResults(); });
  q.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); moveSel(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveSel(-1); }
    else if (e.key === 'Enter' && S.shown[S.sel]) { e.preventDefault(); go('map-' + S.shown[S.sel].id); }
    else if (e.key === 'Escape') { q.value = S.q = ''; S.sel = 0; $('#liveWrap').hidden = false; renderResults(); }
  });
  $('#chips').addEventListener('click', (e) => {
    const c = e.target.closest('.chip'); if (!c) return;
    if (c.dataset.f) { S.rankedOnly = !S.rankedOnly; store.set('bp-ranked', S.rankedOnly ? '1' : '0'); }
    else S.mode = S.mode === c.dataset.mode ? null : c.dataset.mode;
    document.querySelectorAll('#chips .chip').forEach((b) => b.setAttribute('aria-pressed', b.dataset.f ? S.rankedOnly : S.mode === b.dataset.mode));
    S.sel = 0; renderResults();
  });
  app.querySelectorAll('.lcard').forEach((b) => b.addEventListener('click', () => go('map-' + b.dataset.id)));
  if (matchMedia('(pointer: fine)').matches) q.focus();
}

function renderResults() {
  const text = S.q.trim();
  let list;
  if (text) {
    list = pool().map((m) => ({ m, s: matchScore(text, m.name) })).filter((x) => x.s !== null)
      .sort((a, b) => a.s - b.s || (b.m.ranked - a.m.ranked) || ((b.m.live != null) - (a.m.live != null)) || a.m.name.localeCompare(b.m.name)).map((x) => x.m).slice(0, 12);
  } else {
    list = pool().slice().sort((a, b) => (b.ranked - a.ranked) || a.mode.localeCompare(b.mode) || a.name.localeCompare(b.name));
  }
  S.shown = list; S.sel = Math.min(S.sel, Math.max(0, list.length - 1));
  $('#listHead').innerHTML = text ? `Matches <small>↑↓ to move · Enter to open</small>` : `All maps <small>${list.length} · ranked first</small>`;
  $('#results').innerHTML = list.map((m, i) => `
    <li role="option" data-id="${m.id}" class="${i === S.sel ? 'sel' : ''}" aria-selected="${i === S.sel}">
      <span class="dot" style="--mc:${m.mc}"></span>
      <span class="name">${hl(m.name)}</span>
      <span class="meta">
        <span class="minis" title="Top 3 picks">${m.picks.slice(0, 3).map((p) => av(p.b)).join('')}</span>
        ${m.ranked ? '<b class="tag">Ranked</b>' : ''}${m.live != null ? '<b class="tag live">Live</b>' : ''}
        <span class="mname">${esc(m.mode)}</span><span class="enter">↵</span>
      </span>
    </li>`).join('');
  $('#hint').textContent = text && !list.length ? 'No map matches. Try the first letter of each word.' : '';
  $('#results').onclick = (e) => { const li = e.target.closest('li[data-id]'); if (li) go('map-' + li.dataset.id); };
}
const hl = (n) => esc(n).replace(/(^|[\s-])([A-Za-z0-9])/g, '$1<u>$2</u>');
function moveSel(d) {
  if (!S.shown.length) return;
  S.sel = (S.sel + d + S.shown.length) % S.shown.length;
  [...$('#results').children].forEach((li, i) => { li.classList.toggle('sel', i === S.sel); li.setAttribute('aria-selected', i === S.sel); });
  $('#results').children[S.sel]?.scrollIntoView({ block: 'nearest' });
}

function rankedPicks(m) {
  if (S.view !== 'mine' || !S.account) return m.picks.map((p) => ({ ...p, o: null, adj: p.score }));
  // re-rank: locked brawlers drop out, under-built ones lose up to ~10 points
  return m.picks.map((p) => {
    const o = S.account.own[p.b.id];
    return { ...p, o, locked: !o, adj: o ? p.score - (1 - readiness(o)) * 10 : -1 };
  }).sort((a, b) => b.adj - a.adj);
}

function renderMap(m) {
  const mine = S.view === 'mine' && S.account;
  const list = rankedPicks(m);
  const avail = list.filter((p) => !p.locked);
  const top = avail.slice(0, 5);
  const rest = mine ? [...avail.slice(5), ...list.filter((p) => p.locked)] : list.slice(5);
  const scores = list.filter((p) => !p.locked).map((p) => p.adj);
  const hi = Math.max(...scores), lo = Math.min(...scores);
  const bar = (s) => 12 + (88 * (s - lo)) / Math.max(.1, hi - lo);
  const lockedTop = mine ? m.picks.slice(0, 5).filter((p) => !S.account.own[p.b.id]) : [];

  app.innerHTML = `
    <button class="back" id="back">← All maps</button>
    <div class="maphead" style="--mc:${m.mc}">
      <canvas id="art"></canvas>
      <div>
        <p class="mode">${esc(m.mode)} ${m.ranked ? '<b class="tag">Ranked</b>' : ''}${m.live != null ? `<b class="tag live">Live · ${hrs(m.live)} left</b>` : ''}</p>
        <h1>${esc(m.name)}</h1>
        <p class="sub"><b>${m.battles.toLocaleString()}</b> battles from top players · last 14 days · updated today 09:17 UTC</p>
      </div>
    </div>

    <div class="seg" role="group" aria-label="Ranking">
      <button data-v="meta" aria-pressed="${!mine}">Best overall</button>
      <button data-v="mine" aria-pressed="${!!mine}">Best for me</button>
    </div>
    <p class="segnote">${!S.account && S.view === 'mine'
      ? `Add your player tag to rank by the brawlers you own. <a id="toAcct">Add tag</a>`
      : mine ? `Ranked for <b>${esc(S.account.tag)}</b>: locked brawlers move down, low power levels count against a pick.${lockedTop.length ? ` You don't have ${lockedTop.map((p) => esc(p.b.n)).join(', ')} from the overall top 5.` : ''}`
      : `Ranked by win rate, adjusted so brawlers with few games don't jump to the top.`}</p>

    <ol class="top5">${top.map((p, i) => `
      <li>
        <span class="rank">${i + 1}</span>
        ${av(p.b)}
        <span class="bn" title="${esc(p.b.n)}">${esc(p.b.n)}</span>
        <span class="cls">${esc(p.b.cls)}</span>
        <span class="wrbig ${p.wr >= 55 ? 'hi' : ''}">${pct(p.wr)}</span>
        <span class="ur">${pct(p.use)} picked</span>
        ${mine ? `<span class="build ${buildClass(p.o)}">${buildLabel(p.o)}</span>` : ''}
      </li>`).join('')}</ol>
    <p class="legend"><b>Win %</b> is the raw win rate on this map. <b>Picked</b> is how often the brawler shows up in those battles.</p>

    <h2>Also strong <small>${mine ? 'owned first' : 'ranks 6–20'}</small></h2>
    <ul class="rest">${rest.map((p, i) => `
      <li class="${p.locked ? 'locked' : ''}">
        <span class="rk">${p.locked ? '–' : i + 6}</span>
        ${av(p.b)}
        <span class="rn"><b>${esc(p.b.n)}</b><span>${mine ? buildLabel(p.o) : esc(p.b.cls) + ' · ' + pct(p.use) + ' picked'}</span></span>
        <span class="barwrap"><span class="bar" style="width:${p.locked ? 0 : bar(p.adj).toFixed(0)}%"></span></span>
        <span class="wr">${pct(p.wr)}</span>
      </li>`).join('')}</ul>`;
  drawMap($('#art'), m);
  $('#back').onclick = () => go('');
  app.querySelectorAll('.seg button').forEach((b) => b.onclick = () => { S.view = b.dataset.v; renderMap(m); });
  const t = $('#toAcct'); if (t) t.onclick = () => go('account');
}

function renderAccount() {
  const a = S.account;
  const owned = a ? BRAWLERS.filter((b) => a.own[b.id]) : [];
  const maxed = owned.filter((b) => a.own[b.id].p === 11).length;
  app.innerHTML = `
    <button class="back" id="back">← All maps</button>
    <section class="acctview">
      <h1>Your brawlers</h1>
      <p>Enter your player tag and every map gets a <b>Best for me</b> view. It ranks the brawlers you own and accounts for power level, star powers, gadgets and gears. Your tag is in your in-game profile, under your name.</p>
      <form class="tagform" id="tagForm">
        <input id="tagIn" placeholder="#2PP0Y8LQ" value="${esc(a?.tag || '#2PP0Y8LQ')}" aria-label="Player tag" maxlength="12">
        <button class="btn" type="submit">${a ? 'Refresh' : 'Load brawlers'}</button>
        ${a ? '<button class="btn ghost" type="button" id="forget">Remove</button>' : ''}
      </form>
      ${a ? `
        <div class="pcard">
          <span class="av" style="--cc:#ffc928;color:#1d1400;text-shadow:none">SB</span>
          <div class="pi"><b>${esc(a.name)}</b><span>${esc(a.tag)} · sample account</span></div>
        </div>
        <div class="stats3">
          <div><b>${owned.length}<small style="font-size:13px;color:var(--dim)">/${BRAWLERS.length}</small></b><span>Unlocked</span></div>
          <div><b>${maxed}</b><span>Power 11</span></div>
          <div><b>${a.trophies.toLocaleString()}</b><span>Trophies</span></div>
        </div>
        <h2>Roster <small>dimmed = locked</small></h2>
        <div class="roster">${BRAWLERS.slice().sort((x, y) => (a.own[y.id]?.p || 0) - (a.own[x.id]?.p || 0) || x.n.localeCompare(y.n)).map((b) => {
          const o = a.own[b.id];
          return `<div class="${o ? '' : 'no'}">${av(b)}<span>${esc(b.n)}</span><em class="${o?.p === 11 ? 'max' : ''}">${o ? 'P' + o.p : '—'}</em></div>`;
        }).join('')}</div>` : ''}
    </section>`;
  $('#back').onclick = () => go('');
  $('#tagForm').onsubmit = (e) => {
    e.preventDefault();
    let t = $('#tagIn').value.trim().toUpperCase().replace(/^#?/, '#').replace(/O/g, '0');
    if (t.length < 4) return;
    S.account = makeAccount(t); S.view = 'mine'; store.set('bp-tag', t);
    renderAccount(); renderAcctBtn();
  };
  const f = $('#forget'); if (f) f.onclick = () => { S.account = null; S.view = 'meta'; store.set('bp-tag', ''); renderAccount(); renderAcctBtn(); };
}

function renderAcctBtn() {
  const b = $('#acctBtn');
  b.classList.toggle('on', !!S.account);
  b.innerHTML = S.account ? `<i>SB</i><span>${esc(S.account.tag)}</span>` : `<i>+</i><span>Add player tag</span>`;
}

// ---------- routing (plain #name hashes) ----------
function go(h) { if (location.hash.slice(1) === h) route(); else location.hash = h; }
function route() {
  const h = location.hash.slice(1);
  if (h.startsWith('map-') && mapsById.has(h.slice(4))) { renderMap(mapsById.get(h.slice(4))); window.scrollTo(0, 0); }
  else if (h === 'account') { renderAccount(); window.scrollTo(0, 0); }
  else renderHome();
}
window.addEventListener('hashchange', route);
$('#home').onclick = () => { S.q = ''; go(''); };
$('#acctBtn').onclick = () => go('account');
document.addEventListener('keydown', (e) => {
  const q = $('#q');
  if (e.key === '/' && q && document.activeElement !== q) { e.preventDefault(); q.focus(); q.select(); }
  else if (e.key === 'Escape' && !q) go('');
});
renderAcctBtn();
route();
</script>
