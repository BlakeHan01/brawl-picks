<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Brawl Picks</title>
  <meta name="description" content="Best Brawl Stars brawlers for every map, from Ranked and high-trophy games of top players. Search by map initials." />
  <meta name="theme-color" content="#13101d" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ffc928'/%3E%3Ctext x='16' y='23' font-size='18' font-weight='900' text-anchor='middle' font-family='sans-serif' fill='%2313101d'%3EB%3C/text%3E%3C/svg%3E" />
  <link rel="preload" href="data/data.json" as="fetch" crossorigin />
  <link rel="preload" href="data/rotation.json" as="fetch" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="logo" href="#" aria-label="Home">Brawl<span>Picks</span></a>
      <button id="acctBtn" class="acct" hidden>Add player tag</button>
    </header>

    <main>
      <section id="searchView">
        <div class="searchbox">
          <div class="sb">
            <input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false"
                   placeholder="Map initials, e.g. hrm → Hard Rock Mine" aria-label="Search maps" />
            <kbd id="kbdHint">/</kbd>
          </div>
          <div class="chips" id="chips"></div>
        </div>
        <div id="liveWrap">
          <h2>Live now <small id="liveNote"></small></h2>
          <div class="rot" id="live"></div>
        </div>
        <h2 id="listHead"></h2>
        <ul id="results" class="results" role="listbox" aria-label="Maps"></ul>
        <p id="hint" class="hint"></p>
      </section>

      <section id="mapView" hidden></section>
    </main>

    <footer class="foot" id="foot"></footer>
  </div>

  <button id="searchFab" class="fab" aria-label="Search maps">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
  </button>

  <div id="acctBox" class="sheet" role="dialog" aria-labelledby="acctTitle" hidden>
    <form id="acctForm" class="sheet-in">
      <h2 id="acctTitle">Your player tag</h2>
      <p>Find it under your name in your in-game profile. We look up which brawlers you own and how built up they are, to make Curated pick. It's saved on this device only.</p>
      <input id="tagIn" placeholder="#2PP0Y8LQ" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Player tag" maxlength="14" />
      <p id="acctMsg" class="msg" role="status"></p>
      <div class="row">
        <button class="btn" type="submit">Save</button>
        <button class="btn ghost" type="button" id="acctCancel">Cancel</button>
        <button class="btn ghost danger" type="button" id="acctRemove">Remove</button>
      </div>
    </form>
  </div>

  <div id="searchTip" class="tipbox" role="dialog" aria-labelledby="tipTitle" hidden>
    <p id="tipTitle"><b>Tip:</b> press <span id="tipKeys"></span> anywhere to jump to search.</p>
    <button id="tipOk" class="btn">OK</button>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
