name: Data + deploy

# Every 30 min: refresh the event rotation (map timers).
# Every 3 hours (at :17): also pull the per-map brawler stats.
# Pages is redeployed only when something changed (or on push / manual run).
on:
  schedule:
    - cron: "17 */3 * * *"
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      stats:
        description: "Also pull brawler stats"
        type: boolean
        default: true
      backfill_days:
        description: "One-off backfill: rebuild this many days (0 = normal run)"
        type: number
        default: 0
      crawl_limit:
        description: "Players to crawl beyond the top players (blank = default 3000)"
        type: string
        default: ""
      profile_limit:
        description: "Legendary+ profiles to read for builds (blank = default 1500)"
        type: string
        default: ""
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.commit.outputs.deploy }}
    env:
      BS_API_KEY: ${{ secrets.BS_API_KEY }}
      WANT_STATS: ${{ github.event.schedule == '17 */3 * * *' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.stats) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Generated data lives on the `data` branch (one commit, replaced each run), not on main.
      - name: Restore data
        run: scripts/data-branch.sh restore

      - name: Event rotation
        id: rotation
        continue-on-error: true
        run: node scripts/fetch-rotation.mjs

      - name: Brawler stats
        id: stats
        if: env.WANT_STATS == 'true'
        continue-on-error: true # keep serving the last good data if the pull fails
        env:
          CLASS_FILE: data/brawler-classes.json
          BACKFILL_DAYS: ${{ inputs.backfill_days || 0 }}
          CRAWL_LIMIT: ${{ inputs.crawl_limit || 3000 }}
          PROFILE_LIMIT: ${{ inputs.profile_limit || 1500 }}
        run: node scripts/fetch-data.mjs

      # CDN art is 4-10x larger than shown; shrink new images (also catches maps added by rotation runs).
      - name: Shrink images
        if: env.WANT_STATS == 'true'
        continue-on-error: true
        run: npm install --no-save --no-package-lock sharp@0.33.5 && node scripts/shrink-images.mjs

      - name: Save data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          out=$(scripts/data-branch.sh save)
          echo "$out"
          if [ "$out" = "changed=true" ] || [ "${{ github.event_name }}" != "schedule" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      # Version the code file links so browsers fetch new code right after a deploy
      # instead of reusing cached copies (GitHub Pages lets them cache for 10 minutes).
      - name: Version asset links
        if: steps.commit.outputs.deploy == 'true'
        run: |
          v=$(git rev-parse --short HEAD)
          sed -i "s#href=\"style.css\"#href=\"style.css?v=$v\"#; s#src=\"app.js\"#src=\"app.js?v=$v\"#; s#rel=\"modulepreload\" href=\"\([a-z-]*\)\.js\"#rel=\"modulepreload\" href=\"\1.js?v=$v\"#g" site/index.html
          sed -i "s#from '\./\([a-z-]*\)\.js'#from './\1.js?v=$v'#g" site/*.js
          grep -c "?v=$v" site/index.html site/app.js

      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.deploy == 'true'
        with:
          path: site

      - name: Fail the run if a pull failed (site keeps the previous data)
        if: steps.rotation.outcome == 'failure' || steps.stats.outcome == 'failure'
        run: |
          echo "rotation: ${{ steps.rotation.outcome }}, stats: ${{ steps.stats.outcome }}"
          exit 1

  deploy:
    needs: data
    if: always() && needs.data.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
