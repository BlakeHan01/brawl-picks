name: Data + deploy

# Every 30 min: refresh the event rotation (map timers).
# Every 3 hours (at :17): also pull the per-map brawler stats.
# Pages is redeployed only when something changed (or on push / manual run).
on:
  schedule:
    - cron: "17 */3 * * *"
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      stats:
        description: "Also pull brawler stats"
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.commit.outputs.deploy }}
    env:
      BS_API_KEY: ${{ secrets.BS_API_KEY }}
      WANT_STATS: ${{ github.event.schedule == '17 */3 * * *' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.stats) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Event rotation
        id: rotation
        continue-on-error: true
        run: node scripts/fetch-rotation.mjs

      - name: Brawler stats
        id: stats
        if: env.WANT_STATS == 'true'
        continue-on-error: true # keep serving the last good data if the pull fails
        run: node scripts/fetch-data.mjs

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then
            echo "deploy=${{ github.event_name != 'schedule' }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: update $(date -u +'%F %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.deploy == 'true'
        with:
          path: site

      - name: Fail the run if a pull failed (site keeps the previous data)
        if: steps.rotation.outcome == 'failure' || steps.stats.outcome == 'failure'
        run: |
          echo "rotation: ${{ steps.rotation.outcome }}, stats: ${{ steps.stats.outcome }}"
          exit 1

  deploy:
    needs: data
    if: always() && needs.data.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
