name: Daily data + deploy

on:
  schedule:
    - cron: "17 9 * * *" # every day 09:17 UTC (~1am Pacific)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull map + brawler stats
        id: fetch
        continue-on-error: true # keep serving yesterday's data if the pull fails
        env:
          BS_API_KEY: ${{ secrets.BS_API_KEY }}
        run: node scripts/fetch-data.mjs
      - name: Commit data if changed
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/data.json
          git diff --cached --quiet || (git commit -m "data: daily update $(date -u +%F)" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Fail the run if the pull failed (site still deployed with old data)
        if: steps.fetch.outcome != 'success'
        run: exit 1

  deploy:
    needs: data
    if: always() && needs.data.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
